
name: Discover public UAE hiring signals

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 1-5' # 09:15 Dubai, Monday-Friday (UTC+4)

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover and AI-screen public employers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python discover.py

      - name: Commit updated signals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/signals.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public UAE discovery signals'
            git push
          fi
